name: CI — ndn-radio

# CI for the named-radio MAC + PHY faces: fmt + clippy -D warnings + host unit/integration tests.
#
# ndn-radio path-deps ndn-rs (packet/tlv/transport/time) and ndn-radio-drivers
# (HAL / frame-io) as `../` siblings, so every job checks those out next to
# ndn-radio/. Siblings are pinned to known-good SHAs (bump deliberately) so a
# sibling push cannot redden this gate. ⚠ These SHAs must be PUSHED to the
# Quarmire remotes; on release, switch the path deps to { git, tag } and drop
# the checkouts.
#
# Built and linted but NOT run: the feature-gated on-air examples (dev-examples /
# shared-mux / libusb-backend / serial-radio) need a radio on the bus to run, not
# to compile — --all-targets --all-features keeps them from rotting unseen.
# Tests run --lib --tests so CI stays host-only and fast.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ndn-radio

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (all targets, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-radio }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-rs
          ref: 2a5840be79098017965517e6c975874602d7f22a # pinned sibling; bump deliberately
          path: ndn-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-radio-drivers
          ref: 985cd9d70ce0664c6b622da29545c6aa2cd0448c # pinned sibling; bump deliberately
          path: ndn-radio-drivers
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-ext
          ref: 27646a78bb0fd91a7f1fba1f295d5a9ad220fef6 # pinned sibling; bump deliberately
          path: ndn-ext
      # libdbus: --all-features builds the BLE backend (btleplug → dbus on Linux).
      - name: Install system dependencies (libusb, libdbus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-radio
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt (this repo's packages; path-dep siblings gate their own)
        run: |
          PKGS=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(' '.join('-p '+p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo fmt $PKGS -- --check
      - name: clippy (workspace, all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: host tests (workspace lib + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-radio }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-rs
          ref: 2a5840be79098017965517e6c975874602d7f22a # pinned sibling; bump deliberately
          path: ndn-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-radio-drivers
          ref: 985cd9d70ce0664c6b622da29545c6aa2cd0448c # pinned sibling; bump deliberately
          path: ndn-radio-drivers
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-ext
          ref: 27646a78bb0fd91a7f1fba1f295d5a9ad220fef6 # pinned sibling; bump deliberately
          path: ndn-ext
      - name: Install system dependencies (libusb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-radio
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --lib --tests runs the unit + integration suites (incl. ndn-coding's
      # policy/lpm + the mac facet/e2e-software tests) without building the
      # hardware examples. ndn-coding's endpoint gate is exercised via its deps.
      - name: unit + integration tests
        run: cargo test --workspace --lib --tests
