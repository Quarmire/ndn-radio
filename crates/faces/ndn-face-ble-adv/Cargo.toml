[package]
name = "ndn-face-ble-adv"
description = "Connectionless BLE advertising face for ndn-rs — broadcasts NDN packets as BLE advertisements (named-radio bearer, no pairing, no association)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
# The ESP32-C5 serial-bridged BLE backend (firmware/esp32c5-ble): NimBLE extended advertising + scanning,
# host-driven over USB-serial. Pulls `serialport`.
serial = ["dep:serialport"]
# Shared-mux BLE backend: BLE over a shared `ndn_radio_drivers::SerialRadioBackend`, so one host connection
# carries BOTH the Wi-Fi FrameIo and the BLE bearer of the unified ESP32-C5 firmware (`SharedBleBackend`).
shared-mux = ["dep:ndn-radio-drivers", "ndn-radio-drivers/serial-radio"]

[dependencies]
ndn-transport    = { workspace = true }
serialport       = { version = "4", optional = true, default-features = false }
ndn-radio-drivers = { path = "../../../../ndn-radio-drivers", optional = true }
ndn-signals-core = { workspace = true }
ndn-ble-framing  = { workspace = true }
bytes            = { workspace = true, features = ["std"] }
tracing          = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
tokio            = { workspace = true, features = ["sync", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
ndn-packet = { workspace = true }
# For the ble_engine example: run a real forwarding engine (PIT/FIB) over the BLE face.
ndn-app = { workspace = true }
ndn-engine = { workspace = true }
tokio-util = { workspace = true }
# For the wireless_c5 example: the unified WirelessFace over Wi-Fi + BLE from one C5 (shared mux).
ndn-face-wireless     = { path = "../ndn-face-wireless" }
ndn-face-monitor-wifi = { path = "../ndn-face-monitor-wifi" }
# For wireless_c5_engine: the soft-prefix-reach forwarding strategy above the WirelessFace.
ndn-strategy       = { workspace = true }
ndn-strategy-reach = { path = "../../strategies/ndn-strategy-reach" }

[lints]
workspace = true

[[example]]
name = "ble_c5"
required-features = ["serial"]

[[example]]
name = "ble_roundtrip"
required-features = ["serial"]

[[example]]
name = "shared_mux"
required-features = ["shared-mux"]

[[example]]
name = "ble_engine"
required-features = ["shared-mux"]

[[example]]
name = "wireless_c5"
required-features = ["shared-mux"]

[[example]]
name = "wireless_c5_engine"
required-features = ["shared-mux"]
