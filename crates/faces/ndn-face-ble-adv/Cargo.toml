[package]
name = "ndn-face-ble-adv"
description = "Connectionless BLE advertising face for ndn-rs — broadcasts NDN packets as BLE advertisements (named-radio bearer, no pairing, no association)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
# The ESP32-C5 serial-bridged BLE backend (firmware/esp32c5-ble): NimBLE extended advertising + scanning,
# host-driven over USB-serial. Pulls `serialport`.
serial = ["dep:serialport"]

[dependencies]
ndn-transport    = { workspace = true }
serialport       = { version = "4", optional = true, default-features = false }
ndn-signals-core = { workspace = true }
ndn-ble-framing  = { workspace = true }
bytes            = { workspace = true, features = ["std"] }
tracing          = { workspace = true }
thiserror        = { workspace = true }
async-trait      = { workspace = true }
tokio            = { workspace = true, features = ["sync", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
ndn-packet = { workspace = true }

[lints]
workspace = true

[[example]]
name = "ble_c5"
required-features = ["serial"]

[[example]]
name = "ble_roundtrip"
required-features = ["serial"]
