[package]
name = "ndn-radio-cognition"
description = "Cross-layer cognitive control plane for the named-data radio — the sense→decide→act loop (data-centric MAC) that drives the PHY/link actuators from names + medium state"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
# The integrating control plane for the named-data radio: a research/extension
# layer (no adopted community spec). Pure, sans-IO, runtime-agnostic — the
# face/engine I/O lives in the LinkServiceFeature seam, not here.
classification = "extension"

[dependencies]
ndn-frame-io = { workspace = true }
ndn-packet   = { workspace = true }
ndn-tlv      = { workspace = true }
ndn-signals-core = { workspace = true }
# The shared radio HAL contract — home of the `RadioCapability` descriptor +
# `Band`/`RadioKind`/`TimingModel` (re-exported through `src/sense.rs`).
ndn-radio-hal    = { workspace = true }

[dev-dependencies]
# Drives the live LoRa radio in examples/lora_cognition.rs (moved here from
# ndn-radio-drivers in P2 — this direction, ext -> radio-drivers, is the DAG).
ndn-radio-drivers = { path = "../../../../ndn-radio-drivers", features = ["lora"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "lora_cognition"

[lints]
workspace = true
