[package]
name = "ndn-face-lora"
description = "Connectionless LoRa face for ndn-rs — broadcasts NDN packets over a serial-bridged SX126x LoRa radio, with plan-driven link FEC (named-radio bearer, no association)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-transport       = { workspace = true }
ndn-radio-hal       = { workspace = true }
ndn-radio-cognition = { workspace = true }
ndn-radio-drivers   = { path = "../../../../ndn-radio-drivers", features = ["lora"] }
ndn-coding          = { path = "../../coding/ndn-coding", default-features = false, features = ["link-fec-bridge"] }
bytes               = { workspace = true, features = ["std"] }
tracing             = { workspace = true }
tokio               = { workspace = true, features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
ndn-frame-io = { workspace = true }

[lints]
workspace = true
